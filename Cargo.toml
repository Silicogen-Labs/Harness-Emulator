[package]
name = "silicogen-terminal-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Linux PTY automation runtime with CLI and MCP clients"
license = "Apache-2.0"

[[bin]]
name = "silicogen-emulation"
path = "src/main.rs"

[[bin]]
name = "terminal-fixture"
path = "fixtures/terminal_fixture.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.31"
libc = "0.2"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
portable-pty = "0.9.0"
resvg = "0.48.1"
rmcp = { version = "3.5.1", features = ["client", "transport-child-process", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1.20"
sha2 = "0.10"
subtle = "2.6.1"
tokio = { version = "1.53", features = ["full"] }
tui-test-rs = "0.1.0"
ulid = "3.0.0"
vte = "0.15.0"

[dev-dependencies]
tempfile = "3.27.0"
